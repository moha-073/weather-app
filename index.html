<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="weather.css">
</head>
<body>
    <main class="container">
        <div class="weather-card" id="weatherCard">
            <header class="app-header">
                <h1>Weather App</h1>
                <p>Check the current weather anywhere</p>
            </header>
            <form  class="search-container">
                <input type="text"
                    placeholder="Search for a city"
                    aria-label="City name"
                >
                <button type="submit" title="Search"
                >
                <img src="weather-images/search-interface-symbol.png" alt="Search" class="search-icon">
                </button>
            </form>
            <div class="error">
                <p>City not found. Please try again.</p>
            </div>
            <section class="weather">
                <div class="weather-main">
                    <div class="weather-image-icon">
                        <img src="weather-images/cloudy.png" alt="Weather condition" class="weather-icon">
                    </div>
                    <div class="temperature"></div>
                    <div class="city-name"></div>
                    <div class="weather-description"></div>
                    <div class="local-time">
                        <span class="time-label">Local Time</span>
                        <span class="time-value"></span>
                    </div>
                </div>
                <div class="weather-values">
                    <div class="weather-detail">
                        <img src="weather-images/weather.png" alt="Humidity">
                        <div>
                            <span class="detail-value humidity-value"></span>
                            <span class="detail-label">Humidity</span>
                        </div>
                    </div>

                    <div class="weather-detail">
                        <img src="weather-images/wind.png" alt="Wind speed">
                        <div>
                            <span class="detail-value wind-value"></span>
                            <span class="detail-label">Wind Speed</span>
                        </div>
                    </div>
                </div>
            </section>
        </div>

    </main>
    

    <script type="module" src="weather.js"></script>
</body>
</html>
